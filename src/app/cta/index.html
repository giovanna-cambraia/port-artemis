<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixed Footer · Blank Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/splitting@1.1.0/dist/splitting.css"
    />
  </head>
  <body>
    <section class="one"><h1>One</h1></section>
    <section class="two"><h1>Two</h1></section>
    <section class="three"><h1>Three</h1></section>

    <div class="footer-revealer"></div>

    <footer>
      <div class="footer-hand-img">
        <img
          src="./assets/left-hand.png"
          alt="left hand placeholder"
          class="ascii-hand"
        />
        <canvas
          width="400"
          height="600"
          style="
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            inset: 0;
            pointer-events: none;
          "
        ></canvas>
      </div>

      <div class="footer-hand-img">
        <img
          src="./assets/right-hand.png"
          alt="right hand placeholder"
          class="ascii-hand"
        />
        <canvas
          width="400"
          height="600"
          style="
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            inset: 0;
            pointer-events: none;
          "
        ></canvas>
      </div>

      <div class="footer-content">
        <nav class="footer-links">
          <a href="#">Work</a>
          <a href="#">About</a>
          <a href="#">Journal</a>
          <a href="#">Contact</a>
        </nav>

        <div class="footer-text">
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloribus
            placeat error soluta ipsum quos! Quisquam provident sint ut quaerat
            quam id explicabo? Amet molestias corrupti animi doloribus eius
            totam delectus!
          </p>
        </div>
      </div>

      <div class="footer-header">
        <h1>Blank</h1>
        <h1>Canvas</h1>
      </div>
    </footer>

    <script type="importmap">
      {
        "imports": {
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js",
          "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/ScrollTrigger.js",
          "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.mjs"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/splitting@1.1.0/dist/splitting.min.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
